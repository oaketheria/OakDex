<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview - Rajada Continua de Folhas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="preview-stage">
    <section class="battle-scene" aria-label="Previa de ataque continuo de folhas">
      <div class="pokemon attacker">
        <img src="https://play.pokemonshowdown.com/sprites/ani/bulbasaur.gif" alt="Bulbasaur atacante">
      </div>

      <div class="pokemon target">
        <img src="https://play.pokemonshowdown.com/sprites/ani/squirtle.gif" alt="Squirtle alvo">
      </div>

      <span class="leaf-stream">
        <span class="wind-ribbon"></span>
        <i class="leaf l1"></i>
        <i class="leaf l2"></i>
        <i class="leaf l3"></i>
        <i class="leaf l4"></i>
        <i class="leaf l5"></i>
        <i class="leaf l6"></i>
        <i class="leaf l7"></i>
        <i class="leaf l8"></i>
        <i class="leaf l9"></i>
        <i class="leaf l10"></i>
        <i class="leaf l11"></i>
        <i class="leaf l12"></i>
      </span>

      <span class="leaf-impact">
        <i class="cut c1"></i>
        <i class="cut c2"></i>
        <i class="cut c3"></i>
        <i class="cut c4"></i>
        <i class="leaf burst b1"></i>
        <i class="leaf burst b2"></i>
        <i class="leaf burst b3"></i>
        <i class="leaf burst b4"></i>
        <i class="leaf burst b5"></i>
        <i class="leaf burst b6"></i>
      </span>
    </section>
  </main>
</body>
</html>
