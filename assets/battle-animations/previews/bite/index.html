<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview - Mordida</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="preview-stage">
    <section class="battle-scene" aria-label="Previa do golpe Mordida">
      <div class="pokemon attacker">
        <img src="https://play.pokemonshowdown.com/sprites/ani/mightyena.gif" alt="Mightyena atacante">
      </div>

      <div class="pokemon target">
        <img src="https://play.pokemonshowdown.com/sprites/ani/psyduck.gif" alt="Psyduck alvo">
      </div>

      <div class="bite-impact" aria-hidden="true">
        <span class="mouth-shadow"></span>
        <span class="jaw upper">
          <i class="fang t1"></i><i class="fang t2"></i><i class="fang t3"></i><i class="fang t4"></i>
        </span>
        <span class="jaw lower">
          <i class="fang t1"></i><i class="fang t2"></i><i class="fang t3"></i><i class="fang t4"></i>
        </span>
        <span class="tooth-hole h1"></span>
        <span class="tooth-hole h2"></span>
        <span class="tooth-hole h3"></span>
        <span class="tooth-hole h4"></span>
        <span class="tooth-hole h5"></span>
        <span class="tooth-hole h6"></span>
        <span class="tooth-hole h7"></span>
        <span class="tooth-hole h8"></span>
        <span class="pressure-ring"></span>
      </div>
    </section>
  </main>
</body>
</html>
