<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview - Onda Psiquica Continua</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="preview-stage">
    <section class="battle-scene" aria-label="Previa de golpe onda psiquica continua">
      <div class="pokemon attacker">
        <img src="https://play.pokemonshowdown.com/sprites/ani/abra.gif" alt="Abra atacante">
      </div>

      <div class="pokemon target">
        <img src="https://play.pokemonshowdown.com/sprites/ani/squirtle.gif" alt="Squirtle alvo">
      </div>

      <span class="psychic-wave">
        <span class="wave-front front-a"></span>
        <span class="wave-front front-b"></span>
        <span class="wave-front front-c"></span>
        <span class="wave-front front-d"></span>
        <span class="wave-trail"></span>
      </span>

      <span class="psychic-impact">
        <span class="mind-ring ring-a"></span>
        <span class="mind-ring ring-b"></span>
        <span class="mind-ring ring-c"></span>
        <span class="mind-core"></span>
      </span>
    </section>
  </main>
</body>
</html>
