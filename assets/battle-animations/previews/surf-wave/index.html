<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview - Surf</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="preview-stage">
    <section class="battle-scene" aria-label="Previa do golpe Surf">
      <div class="pokemon attacker">
        <img src="https://play.pokemonshowdown.com/sprites/ani/squirtle.gif" alt="Squirtle atacante">
      </div>

      <div class="pokemon target">
        <img src="https://play.pokemonshowdown.com/sprites/ani/charmander.gif" alt="Charmander alvo">
      </div>

      <canvas class="surf-canvas" width="920" height="518" aria-hidden="true"></canvas>
      <canvas class="splash-canvas" width="920" height="518" aria-hidden="true"></canvas>

      <span class="surf-impact">
        <span class="wet-sheen"></span>
        <i class="water-stream s1"></i>
        <i class="water-stream s2"></i>
        <i class="water-stream s3"></i>
        <i class="water-stream s4"></i>
        <i class="water-drop d1"></i>
        <i class="water-drop d2"></i>
        <i class="water-drop d3"></i>
        <i class="water-drop d4"></i>
        <i class="water-drop d5"></i>
        <i class="water-drop d6"></i>
      </span>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
