<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview - Metronomo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="preview-stage">
    <section class="battle-scene" aria-label="Previa do golpe Metronomo">
      <div class="pokemon attacker">
        <img src="https://play.pokemonshowdown.com/sprites/ani/clefairy.gif" alt="Clefairy atacante">
      </div>

      <div class="pokemon target">
        <img src="https://play.pokemonshowdown.com/sprites/ani/meowth.gif" alt="Meowth alvo">
      </div>

      <canvas class="metronome-canvas" width="920" height="518" aria-hidden="true"></canvas>

      <div class="metronome-clock" aria-hidden="true">
        <span class="body"></span>
        <span class="dial"></span>
        <span class="pendulum"></span>
        <span class="bob"></span>
        <span class="pivot"></span>
        <span class="tick t1">?</span>
        <span class="tick t2">!</span>
        <span class="tick t3">*</span>
      </div>

      <span class="surprise-impact" aria-hidden="true">
        <span class="mystery-card">?</span>
        <span class="impact-pop"></span>
        <span class="wild-symbol q1">?</span>
        <span class="wild-symbol q2">!</span>
        <span class="wild-symbol q3">★</span>
        <span class="wild-symbol q4">?</span>
        <i class="burst-shard s1"></i>
        <i class="burst-shard s2"></i>
        <i class="burst-shard s3"></i>
        <i class="burst-shard s4"></i>
        <i class="burst-shard s5"></i>
        <i class="burst-shard s6"></i>
      </span>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
