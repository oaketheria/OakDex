<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview - Nevasca</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="preview-stage">
    <section class="battle-scene" aria-label="Previa do golpe Nevasca">
      <div class="pokemon attacker">
        <img src="https://play.pokemonshowdown.com/sprites/ani/glaceon.gif" alt="Glaceon atacante">
      </div>

      <div class="pokemon target">
        <img src="https://play.pokemonshowdown.com/sprites/ani/charmander.gif" alt="Charmander alvo">
      </div>

      <canvas class="blizzard-canvas" width="920" height="518" aria-hidden="true"></canvas>

      <span class="freeze-impact">
        <span class="frost-aura"></span>
        <i class="ice-shard is1"></i>
        <i class="ice-shard is2"></i>
        <i class="ice-shard is3"></i>
        <i class="ice-shard is4"></i>
        <i class="ice-shard is5"></i>
        <i class="ice-shard is6"></i>
      </span>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
