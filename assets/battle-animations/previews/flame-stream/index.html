<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview - Chamas Continuas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="preview-stage">
    <section class="battle-scene" aria-label="Previa de chamas continuas">
      <div class="pokemon attacker">
        <img src="https://play.pokemonshowdown.com/sprites/ani/charmander.gif" alt="Charmander atacante">
      </div>

      <div class="pokemon target">
        <img src="https://play.pokemonshowdown.com/sprites/ani/bulbasaur.gif" alt="Bulbasaur alvo">
      </div>

      <canvas class="flame-canvas" width="920" height="518" aria-hidden="true"></canvas>

      <canvas class="target-fire-canvas" width="920" height="518" aria-hidden="true"></canvas>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
