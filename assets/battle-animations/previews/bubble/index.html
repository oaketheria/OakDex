<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview - Bolha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="preview-stage">
    <section class="battle-scene" aria-label="Previa do golpe Bolha">
      <div class="pokemon attacker">
        <img src="https://play.pokemonshowdown.com/sprites/ani/squirtle.gif" alt="Squirtle atacante">
      </div>

      <div class="pokemon target">
        <img src="https://play.pokemonshowdown.com/sprites/ani/charmander.gif" alt="Charmander alvo">
      </div>

      <canvas class="bubble-canvas" width="920" height="518" aria-hidden="true"></canvas>

      <span class="bubble-impact">
        <span class="wet-ring"></span>
        <i class="pop p1"></i>
        <i class="pop p2"></i>
        <i class="pop p3"></i>
        <i class="pop p4"></i>
      </span>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
