<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview - Rosnado Sombrio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="preview-stage">
    <section class="battle-scene" aria-label="Previa do golpe Rosnado Sombrio">
      <div class="pokemon attacker">
        <img src="https://play.pokemonshowdown.com/sprites/ani/mightyena.gif" alt="Mightyena atacante">
      </div>

      <div class="pokemon target">
        <img src="https://play.pokemonshowdown.com/sprites/ani/kadabra.gif" alt="Kadabra alvo">
      </div>

      <canvas class="snarl-canvas" width="920" height="518" aria-hidden="true"></canvas>

      <span class="snarl-impact" aria-hidden="true">
        <span class="shadow-vortex"></span>
        <span class="sound-ring r1"></span>
        <span class="sound-ring r2"></span>
        <i class="fear-mark m1">!</i>
        <i class="fear-mark m2">!</i>
        <i class="slash s1"></i>
        <i class="slash s2"></i>
        <i class="slash s3"></i>
      </span>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
