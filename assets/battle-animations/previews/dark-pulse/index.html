<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview - Pulso Sombrio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="preview-stage">
    <section class="battle-scene" aria-label="Previa do golpe Pulso Sombrio">
      <div class="pokemon attacker">
        <img src="https://play.pokemonshowdown.com/sprites/ani/umbreon.gif" alt="Umbreon atacante">
      </div>

      <div class="pokemon target">
        <img src="https://play.pokemonshowdown.com/sprites/ani/psyduck.gif" alt="Psyduck alvo">
      </div>

      <canvas class="dark-pulse-canvas" width="920" height="518" aria-hidden="true"></canvas>

      <span class="dark-impact">
        <span class="shadow-core"></span>
        <span class="shadow-ring r1"></span>
        <span class="shadow-ring r2"></span>
        <i class="dark-spark s1"></i>
        <i class="dark-spark s2"></i>
        <i class="dark-spark s3"></i>
        <i class="dark-spark s4"></i>
        <i class="dark-spark s5"></i>
        <i class="dark-spark s6"></i>
      </span>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
