<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview - Pulso do Dragao</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="preview-stage">
    <section class="battle-scene" aria-label="Previa do golpe Pulso do Dragao">
      <div class="pokemon attacker">
        <img src="https://play.pokemonshowdown.com/sprites/ani/dragonair.gif" alt="Dragonair atacante">
      </div>

      <div class="pokemon target">
        <img src="https://play.pokemonshowdown.com/sprites/ani/charmeleon.gif" alt="Charmeleon alvo">
      </div>

      <canvas class="dragon-pulse-canvas" width="920" height="518" aria-hidden="true"></canvas>

      <span class="dragon-impact" aria-hidden="true">
        <span class="dragon-head">
          <i class="snout"></i>
          <i class="horn h1"></i>
          <i class="horn h2"></i>
          <i class="eye e1"></i>
          <i class="eye e2"></i>
        </span>
        <i class="fang f1"></i>
        <i class="fang f2"></i>
        <i class="fang f3"></i>
        <i class="fang f4"></i>
        <i class="arc a1"></i>
        <i class="arc a2"></i>
        <i class="arc a3"></i>
        <span class="shockwave"></span>
      </span>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
