<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview - Cauda Dragao</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="preview-stage">
    <section class="battle-scene" aria-label="Previa do golpe Cauda Dragao">
      <div class="pokemon attacker">
        <img src="https://play.pokemonshowdown.com/sprites/ani/dragonair.gif" alt="Dragonair atacante">
      </div>

      <div class="pokemon target">
        <img src="https://play.pokemonshowdown.com/sprites/ani/charmeleon.gif" alt="Charmeleon alvo">
      </div>

      <canvas class="dragon-tail-canvas" width="920" height="518" aria-hidden="true"></canvas>

      <span class="tail-impact" aria-hidden="true">
        <span class="impact-flash"></span>
        <span class="impact-ring"></span>
        <i class="hit-line l1"></i>
        <i class="hit-line l2"></i>
        <i class="hit-line l3"></i>
        <i class="scale-burst b1"></i>
        <i class="scale-burst b2"></i>
        <i class="scale-burst b3"></i>
        <i class="scale-burst b4"></i>
      </span>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
