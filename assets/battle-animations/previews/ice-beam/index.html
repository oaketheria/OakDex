<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview - Raio de Gelo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="preview-stage">
    <section class="battle-scene" aria-label="Previa do golpe Raio de Gelo">
      <div class="pokemon attacker">
        <img src="https://play.pokemonshowdown.com/sprites/ani/glaceon.gif" alt="Glaceon atacante">
      </div>

      <div class="pokemon target">
        <img src="https://play.pokemonshowdown.com/sprites/ani/charmander.gif" alt="Charmander alvo">
      </div>

      <canvas class="ice-beam-canvas" width="920" height="518" aria-hidden="true"></canvas>

      <span class="freeze-shell">
        <span class="ice-glass"></span>
        <i class="crack c1"></i>
        <i class="crack c2"></i>
        <i class="crack c3"></i>
        <i class="ice-shard s1"></i>
        <i class="ice-shard s2"></i>
        <i class="ice-shard s3"></i>
        <i class="ice-shard s4"></i>
      </span>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
